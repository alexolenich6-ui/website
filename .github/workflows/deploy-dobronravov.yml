name: Deploy Dobronravov landing to GitHub Pages

# Публикует статический экспорт лендинга Давида Добронравова на GitHub Pages.
# URL: https://alexolenich6-ui.github.io/website/
# Сборка идёт на инфраструктуре GitHub Actions (не в локальном контейнере).

on:
  push:
    branches: [claude/serene-sagan-nb9yy6]
    paths:
      - "dobronravov-landing/**"
      - ".github/workflows/deploy-dobronravov.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно — одна публикация.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dobronravov-landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dobronravov-landing/package-lock.json

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Пытаемся включить Pages автоматически. Если у токена нет прав —
          # включить вручную: Settings → Pages → Source: GitHub Actions.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dobronravov-landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Раскрытая книга и горящая свеча">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f6eede"/>
      <stop offset="1" stop-color="#ddceb4"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#glow)"/>

  <!-- candle -->
  <g transform="translate(870 250)">
    <ellipse cx="0" cy="300" rx="60" ry="14" fill="#b59c77" opacity="0.5"/>
    <rect x="-26" y="120" width="52" height="180" rx="6" fill="#e7dac2"/>
    <rect x="-26" y="120" width="14" height="180" rx="6" fill="#f1e7d2"/>
    <rect x="-3" y="86" width="6" height="40" fill="#6f6049"/>
    <path d="M0 50 C -22 78, -18 110, 0 110 C 18 110, 22 78, 0 50 Z" fill="#caa86a"/>
    <path d="M0 66 C -10 84, -8 104, 0 104 C 8 104, 10 84, 0 66 Z" fill="#efe2c4"/>
    <circle cx="0" cy="86" r="120" fill="#f3ead7" opacity="0.45"/>
  </g>

  <!-- open book -->
  <g transform="translate(600 470)">
    <path d="M-360 60 C -200 10, -20 10, 0 40 C 20 10, 200 10, 360 60 L 360 150 C 200 100, 20 100, 0 130 C -20 100, -200 100, -360 150 Z" fill="#e9ddc6"/>
    <path d="M0 40 L 0 130" stroke="#b29c78" stroke-width="3"/>
    <!-- left page lines -->
    <g stroke="#a8916c" stroke-width="3.5" opacity="0.85" fill="none" stroke-linecap="round">
      <path d="M-300 56 q140 -34 280 -8"/>
      <path d="M-300 80 q140 -30 280 -6"/>
      <path d="M-300 104 q140 -26 280 -4"/>
    </g>
    <!-- right page lines -->
    <g stroke="#a8916c" stroke-width="3.5" opacity="0.85" fill="none" stroke-linecap="round">
      <path d="M20 48 q140 -26 280 8"/>
      <path d="M20 72 q140 -22 280 10"/>
      <path d="M20 96 q140 -18 280 12"/>
    </g>
  </g>

  <!-- orthodox three-bar cross above -->
  <g stroke="#7d6f5a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M250 120 v150"/>
    <path d="M230 150 h40"/>
    <path d="M210 185 h80"/>
    <path d="M226 232 l48 -22"/>
  </g>
</svg>

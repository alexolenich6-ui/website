<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Лесная тропа, уходящая вдаль">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece3d2"/>
      <stop offset="1" stop-color="#dccfb8"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdbb9b"/>
      <stop offset="1" stop-color="#b39a76"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#sky2)"/>
  <circle cx="600" cy="250" r="120" fill="#f2e9d7" opacity="0.85"/>

  <!-- rolling ground -->
  <path d="M0 470 q300 -60 600 -10 q300 50 600 -10 v370 H0 Z" fill="url(#ground2)"/>

  <!-- winding path to horizon -->
  <path d="M540 470 C 560 560, 470 650, 360 740 L 700 740 C 660 650, 640 560, 660 470 Z" fill="#e3d6bd"/>
  <path d="M540 470 C 560 560, 470 650, 360 740 M660 470 C 640 560, 660 650, 700 740" fill="none" stroke="#b29c78" stroke-width="2" opacity="0.6"/>

  <!-- trees flanking -->
  <g fill="#6f6049">
    <g transform="translate(150 360)">
      <rect x="-8" y="120" width="16" height="120"/>
      <path d="M0 -10 C -70 90, -60 150, 0 150 C 60 150, 70 90, 0 -10 Z"/>
    </g>
    <g transform="translate(300 410) scale(0.7)">
      <rect x="-8" y="120" width="16" height="140"/>
      <path d="M0 -10 C -70 90, -60 150, 0 150 C 60 150, 70 90, 0 -10 Z"/>
    </g>
    <g transform="translate(1050 360)">
      <rect x="-8" y="120" width="16" height="120"/>
      <path d="M0 -10 C -70 90, -60 150, 0 150 C 60 150, 70 90, 0 -10 Z"/>
    </g>
    <g transform="translate(900 410) scale(0.7)">
      <rect x="-8" y="120" width="16" height="140"/>
      <path d="M0 -10 C -70 90, -60 150, 0 150 C 60 150, 70 90, 0 -10 Z"/>
    </g>
  </g>

  <!-- lone church dome on horizon -->
  <g fill="#7d6f5a">
    <rect x="588" y="392" width="24" height="40"/>
    <path d="M588 392 c-14 -20 4 -42 12 -60 c8 18 26 40 12 60 Z"/>
    <path d="M596 320 h8 M600 312 v26" stroke="#7d6f5a" stroke-width="3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Силуэт Суздаля с церквями и куполами">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="0.55" stop-color="#e7dccb"/>
      <stop offset="1" stop-color="#d9ccb6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b89c"/>
      <stop offset="1" stop-color="#b7a384"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="url(#sky)"/>
  <circle cx="930" cy="200" r="92" fill="#f3ead9" opacity="0.9"/>
  <circle cx="930" cy="200" r="92" fill="none" stroke="#e3d4ba" stroke-width="2"/>

  <!-- birds -->
  <g stroke="#7d6f5a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M180 150 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M260 120 q11 -11 22 0 q11 -11 22 0"/>
    <path d="M150 210 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- distant treeline -->
  <path d="M0 560 q60 -28 120 -10 q70 -34 150 -8 q80 -30 170 -6 q90 -26 200 -10 q120 -22 260 -6 q140 -18 300 0 v300 H0 Z" fill="#cdbda0" opacity="0.7"/>

  <!-- churches silhouettes (ogee onion domes) -->
  <g fill="#6f6049">
    <!-- left church -->
    <rect x="170" y="470" width="120" height="200"/>
    <path d="M170 470 h120 l-12 -34 h-96 Z"/>
    <!-- drum + dome -->
    <rect x="206" y="392" width="48" height="48"/>
    <path d="M206 392 c-26 -36 8 -78 24 -110 c16 32 50 74 24 110 Z"/>
    <rect x="227" y="250" width="6" height="34"/>
    <path d="M222 268 h16 M230 250 v40" stroke="#6f6049" stroke-width="5"/>

    <!-- central cathedral -->
    <rect x="520" y="430" width="200" height="240"/>
    <path d="M520 430 h200 l-16 -40 h-168 Z"/>
    <!-- three drums -->
    <g>
      <rect x="556" y="338" width="40" height="56"/>
      <path d="M556 338 c-22 -32 6 -68 20 -96 c14 28 42 64 20 96 Z"/>
      <rect x="644" y="338" width="40" height="56"/>
      <path d="M644 338 c-22 -32 6 -68 20 -96 c14 28 42 64 20 96 Z"/>
    </g>
    <!-- main large drum + dome -->
    <rect x="588" y="300" width="64" height="80"/>
    <path d="M588 300 c-34 -48 12 -104 32 -148 c20 44 66 100 32 148 Z"/>
    <rect x="617" y="118" width="6" height="40"/>
    <path d="M610 138 h20 M620 118 v52" stroke="#6f6049" stroke-width="6"/>

    <!-- bell tower right -->
    <rect x="860" y="400" width="70" height="270"/>
    <path d="M860 400 h70 l-12 -30 h-46 Z"/>
    <rect x="876" y="300" width="38" height="80"/>
    <path d="M876 300 l19 -54 l19 54 Z"/>
    <path d="M895 246 c-20 -40 12 -70 0 -108 c-12 38 20 68 0 108 Z" transform="translate(0 0)"/>
    <rect x="892" y="150" width="6" height="40"/>
    <path d="M886 168 h18 M895 150 v50" stroke="#6f6049" stroke-width="5"/>

    <!-- small chapel far right -->
    <rect x="1010" y="500" width="84" height="170"/>
    <path d="M1010 500 h84 l-10 -26 h-64 Z"/>
    <rect x="1040" y="436" width="30" height="40"/>
    <path d="M1040 436 c-16 -24 4 -50 15 -72 c11 22 31 48 15 72 Z"/>
  </g>

  <!-- foreground ground / river bank -->
  <path d="M0 640 q200 -40 400 -20 q260 26 540 -6 q160 -18 260 4 v202 H0 Z" fill="url(#hill)"/>
  <path d="M0 700 q300 40 620 8 q280 -28 580 18 v96 H0 Z" fill="#a8926f" opacity="0.55"/>
</svg>
